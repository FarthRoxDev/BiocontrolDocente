# --- Objetivos de aprendizaje -----------------------------------------
objetivos:
  - "Distinguir daño, síntoma, signo y causa, y no aplicar un insecticida sobre un problema que no es de insectos."
  - "Hacer un recorrido de monitoreo que represente el lote completo y no solo el borde."
  - "Revisar la planta por órgano —brotes, envés, flores, frutos, tallos, raíz— sabiendo qué buscar en cada uno."
  - "Instalar y leer trampas amarillas y azules sin confundir captura con infestación."
  - "Llenar una hoja de registro con unidades que se puedan comparar entre fechas."
  - "Decidir si interviene a partir de la tendencia, el daño reciente, la etapa del cultivo y los benéficos presentes."
  - "Escoger la medida por niveles: cultural, mecánico, biológico y químico responsable."
  - "Reconocer las señales de resistencia a insecticidas y rotar de verdad por modo de acción."

temas:
  - diagnóstico en campo: daño, síntoma, signo y causa
  - monitoreo directo e indirecto, recorridos y trampas
  - registro, unidades comparables y tendencia
  - umbral de acción y criterio de decisión
  - MIP por niveles
  - resistencia a insecticidas y rotación por modo de acción

requisitos_previos:
  - "Ninguno. Se parte de la experiencia de campo del participante."

materiales_clase:
  - "Hojas con daño real de masticación y de raspado (trips), para pasar de mano en mano."
  - "Dos trampas adhesivas sin usar, una amarilla y una azul, y si se consigue una ya expuesta en campo."
  - "Lupa de mano o lupa de celular para revisar el envés."
  - "Copias impresas de la hoja de registro del Cuadro 4 (página 19), una por participante."
  - "Etiquetas de dos o tres insecticidas distintos donde se vea el grupo IRAC."
  - "Pizarra o papelógrafo: se usa en casi todos los tramos."

