# --- Objetivos de aprendizaje -----------------------------------------
objetivos:
  - "Explicar con palabras propias qué es un biofertilizante y en qué se diferencia de un fertilizante de síntesis."
  - "Identificar los principales grupos de biofertilizantes: micorrizas arbusculares, fijadores de nitrógeno y solubilizadores de fósforo."
  - "Reconocer las presentaciones comerciales más comunes y para qué sirve cada una."
  - "Decidir en qué momento del cultivo conviene aplicar cada tipo de biofertilizante."
  - "Evaluar la compatibilidad de un biofertilizante con otros productos antes de mezclarlo."
  - "Revisar la etiqueta de un biofertilizante y detectar señales de mala calidad."

temas:
  - tipos de biofertilizantes
  - presentaciones comerciales
  - usos recomendados
  - compatibilidad y tiempos de aplicación
  - características de buena calidad

requisitos_previos:
  - "Ninguno. Se parte de la experiencia de campo del participante."

materiales_clase:
  - "Dos o tres envases reales de biofertilizante con su etiqueta (para el ejercicio de lectura de etiqueta)."
  - "Raíces frescas de un cultivo con y sin inoculación, si están disponibles."
  - "Un balde, agua y una jarra transparente para la prueba de compatibilidad."
  - "Calculadora o celular para el ejercicio de cálculo."

