# --- Objetivos de aprendizaje -----------------------------------------
objetivos:
  - "Explicar qué cambia —y qué no cambia— cuando se siembra material de alta calidad."
  - "Distinguir los cuatro tipos de material de siembra y qué se vigila en cada uno."
  - "Aplicar los cuatro filtros —identidad, sanidad, vigor y trazabilidad— antes de aceptar un lote, y hacer la revisión de recepción con las cinco preguntas."
  - "Llevar el registro de los primeros 30 días y calcular el prendimiento."
  - "Decir qué es la semilla artificial y qué debe exigirle antes de comprarla."
  - "Decidir una mezcla de material preinoculado con el semáforo verde-amarillo-rojo."
  - "Comparar material habitual contra material nuevo por margen bruto, no por precio de compra."

temas:
  - tipos de material de siembra
  - los cuatro filtros y la trazabilidad del lote
  - cultivo in vitro y aclimatación
  - recepción del lote y primeros 30 días
  - semilla artificial
  - material preinoculado y compatibilidad de mezclas
  - trasplante y decisión económica

requisitos_previos:
  - "Ninguno. Se parte de la experiencia de campo del participante."

materiales_clase:
  - "Una bandeja de plántulas real, de cualquier cultivo, para la revisión de recepción (tramo 36–44 min) y la demostración del cepellón (67–72 min)."
  - "Una bolsa de semilla o un atado de estacas con su etiqueta, para el ejercicio de los cuatro filtros."
  - "Una etiqueta de un producto biológico, para el tramo de compatibilidad."
  - "Un envase transparente y agua, para mostrar el alcance y el límite de la prueba del frasco. No mezclar ningún agroquímico real."
  - "Calculadora o celular, para el prendimiento y el margen bruto."
  - "Cámara o celular, para practicar la foto del lote separado."

