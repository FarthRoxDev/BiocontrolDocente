# --- Objetivos de aprendizaje -----------------------------------------
objetivos:
  - "Distinguir si el daño del producto viene de microorganismos, de artrópodos o de manipulación."
  - "Ubicar el punto de la cadena —cosecha, manejo, lavado, empaque, transporte o almacenamiento— donde se originó el problema."
  - "Aplicar buenas prácticas de cosecha: criterio de madurez, horario, sombra y prevención de golpes."
  - "Controlar el agua de lavado y explicar cómo ocurre la contaminación cruzada en el tanque."
  - "Manejar la fruta podrida y los residuos como fuente de inóculo."
  - "Escoger tratamientos poscosecha proporcionales al nivel de inversión disponible."
  - "Armar un plan de tres acciones inmediatas y dos mejoras de mediano plazo."
  - "Medir el resultado con cuatro indicadores por lote: % de rechazo, vida útil, reclamos y pérdida."

temas:
  - diagnóstico rápido poscosecha
  - puntos críticos del proceso
  - buenas prácticas de cosecha y manipulación
  - manejo del agua de lavado
  - empaque, transporte y almacenamiento
  - fruta podrida y residuos como inóculo
  - tratamientos por nivel de inversión
  - plan de acción 3 + 2
  - medición de resultados

requisitos_previos:
  - "Ninguno. Se parte de la experiencia de campo del participante."

materiales_clase:
  - "Dos cajas de cosecha: una limpia e íntegra y otra deformada o con bordes salidos, para comparar."
  - "Un balde con agua y restos vegetales, para mostrar qué es carga orgánica en el tanque (no usar desinfectante real)."
  - "Tiras o kit de medición de pH, solo para mostrar el método; no se dosifica nada en clase."
  - "Fruta o producto con daño visible: pudrición, perforación de insecto y magulladura, una pieza de cada tipo."
  - "Copias impresas del Cuadro 7 (tablero semanal) en tamaño carta, una por participante."
  - "Calculadora o celular para el ejercicio 14."

